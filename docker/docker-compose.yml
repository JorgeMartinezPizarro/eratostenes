# init: true runs a minimal init (tini) as PID 1 in front of the binary. Without
# it eratostenes itself is PID 1, and the kernel ignores signals PID 1 has no
# handler for: Ctrl+C on `make run` (SIGINT, forwarded by `docker compose run`)
# did nothing and the container, --rm included, stayed up until `docker kill`.
services:
  eratostenes:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: eratostenes
    image: eratostenes:latest
    volumes:
      - ../output:/output

  # Full toolchain (gcc + primesieve): runs `make test`/`benchmark` inside
  # the container, see Makefile's docker-* targets below.
  dev:
    init: true
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    image: eratostenes:dev
